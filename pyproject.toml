[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-model-router"
version = "0.2.0"
description = "Lightweight OpenRouter model selection and catalog refresh utility"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dyuhaus" }]
keywords = ["llm", "openrouter", "model-router", "model-selection"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/dyuhaus/openrouter-model-router"
Repository = "https://github.com/dyuhaus/openrouter-model-router"

[project.scripts]
openrouter-model-router = "openrouter_model_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
